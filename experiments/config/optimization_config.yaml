experiments:
  # Experiment 1: No optimizations (baseline)
  baseline:
    name: "Baseline - No Optimizations"
    description: "Default Spark configuration without any optimizations"
    optimizations:
      shuffle_partitions: 200  # Spark default
      enable_aqe: false
      enable_caching: false
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 0  # Disable auto-broadcast
    
  # Experiment 2: Only shuffle partitions tuning
  shuffle_only:
    name: "Shuffle Partitions Only"
    description: "Only optimize shuffle partitions for small dataset"
    optimizations:
      shuffle_partitions: 8
      enable_aqe: false
      enable_caching: false
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 0
    
  # Experiment 3: AQE only
  aqe_only:
    name: "AQE Only"
    description: "Only enable Adaptive Query Execution"
    optimizations:
      shuffle_partitions: 200
      enable_aqe: true
      enable_caching: false
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 0
    
  # Experiment 4: Caching only
  caching_only:
    name: "Caching Only"
    description: "Only enable DataFrame caching"
    optimizations:
      shuffle_partitions: 200
      enable_aqe: false
      enable_caching: true
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 0
    
  # Experiment 5: Compression only
  compression_only:
    name: "Compression Only"
    description: "Only enable Snappy compression"
    optimizations:
      shuffle_partitions: 200
      enable_aqe: false
      enable_caching: false
      enable_coalesce: false
      compression: "snappy"
      broadcast_threshold: 0
    
  # Experiment 6: Broadcast joins only
  broadcast_only:
    name: "Broadcast Only"
    description: "Only enable auto-broadcast joins"
    optimizations:
      shuffle_partitions: 200
      enable_aqe: false
      enable_caching: false
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 10485760  # 10MB
    
  # Experiment 7: Partitioning only
  partitioning_only:
    name: "Partitioning Only"
    description: "Only enable partitioning by category"
    optimizations:
      shuffle_partitions: 200
      enable_aqe: false
      enable_caching: false
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 0
      enable_partitioning: true
      partition_column: "category"
  
  # Experiment 8: All optimizations
  all_optimizations:
    name: "All Optimizations"
    description: "All optimizations enabled"
    optimizations:
      shuffle_partitions: 8
      enable_aqe: true
      enable_caching: true
      enable_coalesce: true
      compression: "snappy"
      broadcast_threshold: 10485760  # 10MB
      enable_partitioning: true
      partition_column: "category"

  # Experiment 9: Everything without partitioning
  all_but_partitioning:
    name: "All But Partitioning"
    description: "All optimizations enabled except partitioning"
    optimizations:
      shuffle_partitions: 8
      enable_aqe: true
      enable_caching: true
      enable_coalesce: true
      compression: "snappy"
      broadcast_threshold: 10485760  # 10MB
      enable_partitioning: false

  # Experiment 10: Shuffle, Broadcast, AQE
  shuffle_broadcast_and_aqe:
    name: "Shuffle, Broadcast, AQE"
    description: "Optimize shuffle partitions, enable broadcast joins and AQE"
    optimizations:
      shuffle_partitions: 8
      enable_aqe: true
      enable_caching: false
      enable_coalesce: false
      compression: "none"
      broadcast_threshold: 10485760  # 10MB

# Experiment execution settings
execution:
  runs_per_experiment: 3  # Number of times to run each experiment
  warmup_runs: 1  # Number of warmup runs before measurement
  products_count: 10000  # Number of products in dataset
  transactions_count: 18000 # Number of transactions in dataset
  users_count: 10000 # Number of users in dataset
  noise_level: 0.03 # Proportion of noise to add to the data
  null_wrong_proportion: 0.5 # Proportion of null/wrong entries in noise

# Paths for data and results
paths:
  data_dir: "experiments/data/" # Base data directory
  bronze_layer_dir: "experiments/data/bronze_layer/" # Bronze layer data directory
  silver_layer_dir: "experiments/data/silver_layer/" # Silver layer data directory
  gold_layer_dir: "experiments/data/gold_layer/" # Gold layer data directory
  results_dir: "experiments/results/" # Results directory
